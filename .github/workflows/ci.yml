# GitHub Actions CI: lint, typecheck and build on every push to main and every PR.
# Vendor: GitHub Actions (free tier about 2,000 min/month on private repos; see docs/VENDORS.md).
# The Supabase values are placeholders so the build can run; CI never talks to the database.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
